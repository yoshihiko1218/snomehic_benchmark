### Rupture — Single-cell Hi-C Pipeline Config Template
###
### Usage:
###   rupture init --dir /path/to/workdir   # creates this file as config.yaml
###   rupture run --configfile config.yaml   # run the pipeline
###
### Copy this file to your working directory, edit the values, then run.

# ── Required ──

sample_id:
  - SRR27586278
  # - sample2  # add more samples as needed

bin_size: 5000       # base resolution for cooler (bp)
genome: "hg38"       # genome assembly label (used in output filenames)

# ── Required: reference paths ──
# These must be set — there are no default paths.

bc_ref: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38_bowtie1/737K-cratac-v1_rc"   # bowtie v1 index prefix for barcode whitelist
ref: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa"                         # genome FASTA (must have bwa index)
chrom_size: "/gpfs/projects/b1198/epifluidlab/yoshii/reference/hg38/autosomes.chrom.sizes"                # chromosome sizes file

# ── Optional: chunked processing for large FASTQs ──
chunk_size: 0            # max FASTQ size in GB per chunk (0 = no splitting)
